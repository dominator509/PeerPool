openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PeerPool decentralized multi-party escrow and dispute-resolution protocol API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: escrows
    description: Escrow management
  - name: manifests
    description: Manifest registry
  - name: participants
    description: Escrow participants
  - name: votes
    description: Outcome voting
  - name: disputes
    description: Dispute resolution
  - name: claims
    description: Settlement claims
  - name: activity
    description: Activity feed
  - name: stats
    description: Protocol statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /escrows:
    get:
      operationId: listEscrows
      tags: [escrows]
      summary: List all escrows
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, funded, active, disputed, settled, closed]
        - name: chain
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of escrows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowList"
    post:
      operationId: createEscrow
      tags: [escrows]
      summary: Create a new escrow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEscrowBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escrow"

  /escrows/summary:
    get:
      operationId: getEscrowSummary
      tags: [escrows]
      summary: Dashboard summary of escrows
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowSummary"

  /escrows/{id}:
    get:
      operationId: getEscrow
      tags: [escrows]
      summary: Get escrow details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Escrow detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escrow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateEscrow
      tags: [escrows]
      summary: Update escrow state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEscrowBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escrow"

  /escrows/{id}/participants:
    get:
      operationId: listParticipants
      tags: [participants]
      summary: List participants in an escrow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantList"
    post:
      operationId: addParticipant
      tags: [participants]
      summary: Add a participant to an escrow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddParticipantBody"
      responses:
        "201":
          description: Participant added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"

  /escrows/{id}/votes:
    get:
      operationId: listVotes
      tags: [votes]
      summary: List votes for an escrow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Votes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteList"
    post:
      operationId: submitVote
      tags: [votes]
      summary: Submit a vote on an outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitVoteBody"
      responses:
        "201":
          description: Vote submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vote"

  /escrows/{id}/claims:
    get:
      operationId: listClaims
      tags: [claims]
      summary: List claims for an escrow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimList"
    post:
      operationId: createClaim
      tags: [claims]
      summary: Create a settlement claim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimBody"
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"

  /escrows/{id}/claims/{claimId}/submit:
    post:
      operationId: submitClaim
      tags: [claims]
      summary: Submit a claim with merkle proof
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: claimId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitClaimBody"
      responses:
        "200":
          description: Claim submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"

  /manifests:
    get:
      operationId: listManifests
      tags: [manifests]
      summary: List all manifests
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Manifests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManifestList"
    post:
      operationId: createManifest
      tags: [manifests]
      summary: Register a new manifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManifestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"

  /manifests/{id}:
    get:
      operationId: getManifest
      tags: [manifests]
      summary: Get manifest details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /disputes:
    get:
      operationId: listDisputes
      tags: [disputes]
      summary: List all disputes
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [open, escalated, resolved, closed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Disputes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeList"
    post:
      operationId: createDispute
      tags: [disputes]
      summary: Open a dispute for an escrow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDisputeBody"
      responses:
        "201":
          description: Dispute opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"

  /disputes/summary:
    get:
      operationId: getDisputeSummary
      tags: [disputes]
      summary: Dispute resolution stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeSummary"

  /disputes/{id}:
    get:
      operationId: getDispute
      tags: [disputes]
      summary: Get dispute details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /disputes/{id}/resolve:
    post:
      operationId: resolveDispute
      tags: [disputes]
      summary: Resolve a dispute with a verdict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDisputeBody"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"

  /disputes/{id}/ai-review:
    post:
      operationId: runAiDisputeReview
      tags: [disputes]
      summary: Run AI review on a dispute and generate a verdict summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AI verdict generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReviewResult"
        "404":
          description: Dispute not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /disputes/{id}/escalate:
    post:
      operationId: escalateDisputeToKleros
      tags: [disputes]
      summary: Escalate a dispute to Kleros arbitration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalateDisputeBody"
      responses:
        "200":
          description: Escalated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KlerosEscalationResult"
        "404":
          description: Dispute not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /disputes/{id}/kleros-status:
    get:
      operationId: getKlerosStatus
      tags: [disputes]
      summary: Get Kleros arbitration status for a dispute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Kleros status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KlerosStatus"
        "404":
          description: Dispute not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /escrows/{id}/settlement:
    get:
      operationId: getSettlement
      tags: [escrows]
      summary: Get settlement Merkle root and proofs for an escrow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Settlement data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResult"
        "404":
          description: No settlement found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: computeSettlement
      tags: [escrows]
      summary: Compute Merkle settlement root from all claims for an escrow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Settlement computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementResult"
        "404":
          description: Escrow not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /escrows/{id}/settlement/verify:
    post:
      operationId: verifySettlementProof
      tags: [escrows]
      summary: Verify a Merkle proof for a claim allocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyProofBody"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyProofResult"

  /chains:
    get:
      operationId: listChains
      tags: [chains]
      summary: List supported chains
      responses:
        "200":
          description: Supported chains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainList"

  /chains/{name}:
    get:
      operationId: getChain
      tags: [chains]
      summary: Get chain info and latest block
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chain info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainInfo"
        "404":
          description: Chain not supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/indexer:
    get:
      operationId: getIndexerStatus
      tags: [admin]
      summary: Get on-chain indexer status
      responses:
        "200":
          description: Indexer status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerStatus"

  /admin/sync:
    post:
      operationId: triggerSync
      tags: [admin]
      summary: Trigger on-chain event indexer run
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /auth/nonce:
    get:
      operationId: getAuthNonce
      tags: [auth]
      summary: Request a sign-in nonce for an address
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Nonce and sign message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonceResponse"
        "400":
          description: Invalid address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify:
    post:
      operationId: verifySignature
      tags: [auth]
      summary: Verify a wallet signature and issue a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySignatureBody"
      responses:
        "200":
          description: Session token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get current session info from Bearer token
      responses:
        "200":
          description: Session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Recent protocol activity feed
      parameters:
        - name: escrow_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Activity events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"

  /stats:
    get:
      operationId: getProtocolStats
      tags: [stats]
      summary: Global protocol statistics
      responses:
        "200":
          description: Protocol stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolStats"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    EscrowState:
      type: string
      enum: [pending, funded, active, disputed, settled, closed]

    DisputeState:
      type: string
      enum: [open, escalated, resolved, closed]

    ClaimState:
      type: string
      enum: [pending, submitted, executed, rejected]

    ParticipantRole:
      type: string
      enum: [depositor, beneficiary, arbitrator, observer]

    Escrow:
      type: object
      required: [id, title, state, chain, token, totalAmount, creatorAddress, manifestId, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        state:
          $ref: "#/components/schemas/EscrowState"
        chain:
          type: string
        contractAddress:
          type: string
        token:
          type: string
        totalAmount:
          type: string
        fundedAmount:
          type: string
        creatorAddress:
          type: string
        manifestId:
          type: string
        deadline:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        fundedAt:
          type: string
          format: date-time
        participantCount:
          type: integer
        voteCount:
          type: integer

    EscrowList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Escrow"
        total:
          type: integer

    EscrowSummary:
      type: object
      required: [total, byState, totalValueLocked, recentCount]
      properties:
        total:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
        totalValueLocked:
          type: string
        recentCount:
          type: integer
        avgParticipants:
          type: number

    CreateEscrowBody:
      type: object
      required: [title, chain, token, totalAmount, creatorAddress, manifestId]
      properties:
        title:
          type: string
        description:
          type: string
        chain:
          type: string
        token:
          type: string
        totalAmount:
          type: string
        creatorAddress:
          type: string
        manifestId:
          type: string
        deadline:
          type: string
          format: date-time

    UpdateEscrowBody:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/EscrowState"
        contractAddress:
          type: string
        fundedAmount:
          type: string
        fundedAt:
          type: string
          format: date-time

    Participant:
      type: object
      required: [id, escrowId, address, role, joinedAt]
      properties:
        id:
          type: string
        escrowId:
          type: string
        address:
          type: string
        role:
          $ref: "#/components/schemas/ParticipantRole"
        fundedAmount:
          type: string
        joinedAt:
          type: string
          format: date-time

    ParticipantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Participant"

    AddParticipantBody:
      type: object
      required: [address, role]
      properties:
        address:
          type: string
        role:
          $ref: "#/components/schemas/ParticipantRole"
        fundedAmount:
          type: string

    Vote:
      type: object
      required: [id, escrowId, voterAddress, outcomeIndex, votedAt]
      properties:
        id:
          type: string
        escrowId:
          type: string
        voterAddress:
          type: string
        outcomeIndex:
          type: integer
        outcomeLabel:
          type: string
        weight:
          type: string
        signature:
          type: string
        votedAt:
          type: string
          format: date-time

    VoteList:
      type: object
      required: [items, tally]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Vote"
        tally:
          type: array
          items:
            $ref: "#/components/schemas/OutcomeTally"

    OutcomeTally:
      type: object
      required: [outcomeIndex, outcomeLabel, voteCount, totalWeight]
      properties:
        outcomeIndex:
          type: integer
        outcomeLabel:
          type: string
        voteCount:
          type: integer
        totalWeight:
          type: string

    SubmitVoteBody:
      type: object
      required: [voterAddress, outcomeIndex]
      properties:
        voterAddress:
          type: string
        outcomeIndex:
          type: integer
        weight:
          type: string
        signature:
          type: string

    Manifest:
      type: object
      required: [id, title, conditions, outcomes, createdBy, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        conditions:
          type: array
          items:
            type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/ManifestOutcome"
        createdBy:
          type: string
        ipfsHash:
          type: string
        createdAt:
          type: string
          format: date-time
        escrowCount:
          type: integer

    ManifestOutcome:
      type: object
      required: [index, label]
      properties:
        index:
          type: integer
        label:
          type: string
        description:
          type: string
        distributionBps:
          type: integer

    ManifestList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Manifest"
        total:
          type: integer

    CreateManifestBody:
      type: object
      required: [title, conditions, outcomes, createdBy]
      properties:
        title:
          type: string
        description:
          type: string
        conditions:
          type: array
          items:
            type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/ManifestOutcome"
        createdBy:
          type: string
        ipfsHash:
          type: string

    Dispute:
      type: object
      required: [id, escrowId, disputerAddress, reason, state, bondAmount, createdAt]
      properties:
        id:
          type: string
        escrowId:
          type: string
        disputerAddress:
          type: string
        reason:
          type: string
        state:
          $ref: "#/components/schemas/DisputeState"
        bondAmount:
          type: string
        klerosDisputeId:
          type: string
        aiVerdictSummary:
          type: string
        resolvedOutcomeIndex:
          type: integer
        resolvedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time

    DisputeList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Dispute"
