kind = "web"
previewPath = "/"
title = "PeerPool Developer Interface"
version = "1.0.0"
id = "artifacts/peerpool-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21457

[services.development]
run = "pnpm --filter @workspace/peerpool-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/peerpool-web", "run", "build" ]
publicDir = "artifacts/peerpool-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21457"
BASE_PATH = "/"
